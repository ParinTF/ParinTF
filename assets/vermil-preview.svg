<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Vermil Tasks — Small tools. One quiet workspace.</title>
  <desc id="desc">A monochrome project illustration, not a screenshot. Three overlapping cards represent a modular Windows workspace.</desc>
  <rect x="1" y="1" width="1198" height="338" rx="4" fill="#141414" stroke="#333333"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="53" font-size="16" letter-spacing="3" fill="#bcbcbc">VERMIL / WINDOWS</text>
    <text x="44" y="143" font-size="66" font-weight="700" letter-spacing="-2" fill="#fafafa">Small tools.</text>
    <text x="44" y="217" font-size="66" font-weight="700" letter-spacing="-2" fill="#fafafa">One quiet workspace.</text>
    <path d="M48 259H645" stroke="#444444"/>
    <text x="48" y="299" font-size="16" letter-spacing="2" fill="#bcbcbc">MODULAR / LOCAL-FIRST / YOURS</text>
  </g>
  <g transform="translate(805 53)">
    <rect x="94" y="-9" width="208" height="212" rx="8" fill="#242424" stroke="#555555" transform="rotate(9 198 97)"/>
    <rect x="47" y="14" width="208" height="212" rx="8" fill="#333333" stroke="#777777" transform="rotate(-5 151 120)"/>
    <rect y="35" width="226" height="216" rx="8" fill="#f3f3f3"/>
    <g font-family="Arial, Helvetica, sans-serif" fill="#171717">
      <text x="22" y="71" font-size="13" font-weight="700" letter-spacing="2">A LITTLE MORE FOCUS.</text>
      <path d="M22 91H204" stroke="#cccccc"/>
      <rect x="23" y="112" width="16" height="16" rx="3" fill="#171717"/>
      <path d="m27 120 3 3 6-7" fill="none" stroke="#fafafa" stroke-width="1.8"/>
      <text x="51" y="125" font-size="16">Make something useful</text>
      <rect x="23" y="152" width="16" height="16" rx="3" fill="none" stroke="#777777"/>
      <text x="51" y="165" font-size="16">Find your own pace</text>
      <path d="M22 190H204" stroke="#cccccc"/>
      <text x="22" y="226" font-size="13" letter-spacing="1.2" fill="#555555">LESS NOISE. MORE ROOM.</text>
    </g>
  </g>
</svg>
