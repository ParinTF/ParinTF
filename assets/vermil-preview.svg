<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Vermil Tasks — Modular Local-First Windows App</title>
  <desc id="desc">One light Windows app for everyday life with 26 on-demand modules, built with Rust and Tauri 2.</desc>

