<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Parinthorn Sutthikhun — Software Engineer</title>
  <desc id="desc">Thoughtful code. Useful software. A monochrome editorial cover with a sculptural, layered geometric form.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#fafafa"/>
      <stop offset="1" stop-color="#eeeeee"/>
    </linearGradient>
    <linearGradient id="ink" x2="1" y2="1">
      <stop stop-color="#444444"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="458" rx="4" fill="url(#paper)" stroke="#d5d5d5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="54" font-size="17" font-weight="700" letter-spacing="2" fill="#171717">PARINTHORN SUTTHIKHUN</text>
    <text x="1144" y="54" text-anchor="end" font-size="14" letter-spacing="2" fill="#555555">SOFTWARE ENGINEER</text>
    <path d="M56 78H1144" stroke="#cccccc"/>
    <text x="52" y="201" font-size="76" font-weight="700" letter-spacing="-4" fill="#171717">Thoughtful code.</text>
    <text x="52" y="289" font-size="76" font-weight="700" letter-spacing="-4" fill="#171717">Useful software.</text>
    <text x="57" y="336" font-size="19" fill="#555555">From the first data model to the final detail.</text>
    <path d="M56 388H1144" stroke="#cccccc"/>
    <text x="56" y="426" font-size="14" letter-spacing="2" fill="#555555">DATA / API / INTERFACE</text>
    <text x="1144" y="426" text-anchor="end" font-size="14" font-weight="700" letter-spacing="2" fill="#171717">@PARINTF</text>
  </g>
  <g transform="translate(970 231)">
    <circle r="125" fill="none" stroke="#d5d5d5"/>
    <circle r="151" fill="none" stroke="#dddddd" stroke-dasharray="2 7"/>
    <path d="M-106 58 0 0 106 58 0 116Z" fill="#cccccc" stroke="#aaaaaa"/>
    <path d="M-106 29 0-29 106 29 0 87Z" fill="#aaaaaa" stroke="#888888"/>
    <path d="M-106 0 0-58 106 0 0 58Z" fill="#777777" stroke="#555555"/>
    <path d="M-106-29 0-87 106-29 0 29Z" fill="url(#ink)" stroke="#111111"/>
    <path d="M-106-29 0 29 106-29M0 29V58" fill="none" stroke="#eeeeee" stroke-opacity=".45"/>
    <path d="M0-117V-137M0 137V157M-137 0H-157M137 0H157" stroke="#777777"/>
    <circle cy="-87" r="4" fill="#fafafa" stroke="#171717"/>
  </g>
</svg>
