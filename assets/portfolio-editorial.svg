<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Parinthorn Sutthikhun — Software Engineer</title>
  <desc id="desc">Ideas become useful software. Engineered from data model to backend API to deployed UI.</desc>

  <!-- Deep obsidian canvas -->
  <rect width="1200" height="380" rx="8" fill="#09090b"/>
  <rect x="1" y="1" width="1198" height="378" rx="7" fill="none" stroke="#222228" stroke-width="1.5"/>

  <!-- Subtle architectural grid -->
  <line x1="64" y1="0" x2="64" y2="380" stroke="#16161b" stroke-width="1"/>
  <line x1="420" y1="64" x2="420" y2="316" stroke="#131317" stroke-width="1"/>
  <line x1="790" y1="64" x2="790" y2="316" stroke="#16161b" stroke-width="1"/>
  <line x1="1136" y1="0" x2="1136" y2="380" stroke="#16161b" stroke-width="1"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#222228" stroke-width="1"/>
  <line x1="0" y1="316" x2="1200" y2="316" stroke="#222228" stroke-width="1"/>

  <!-- High-voltage vermilion left spine -->
  <rect x="0" y="0" width="6" height="380" fill="#ff4a1c"/>

  <!-- Tactical corner registration marks -->
  <polyline points="64,78 64,64 78,64" fill="none" stroke="#ff4a1c" stroke-width="2"/>
  <polyline points="1122,64 1136,64 1136,78" fill="none" stroke="#ff4a1c" stroke-width="2"/>
  <polyline points="64,302 64,316 78,316" fill="none" stroke="#ff4a1c" stroke-width="2"/>
  <polyline points="1122,316 1136,316 1136,302" fill="none" stroke="#ff4a1c" stroke-width="2"/>

  <!-- Top telemetry header -->
  <circle cx="88" cy="34" r="4" fill="#ff4a1c"/>
  <text x="102" y="38" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2.5" fill="#f4f1ea">PARINTHORN SUTTHIKHUN</text>
  <text x="336" y="38" font-family="Consolas,monospace" font-size="12" letter-spacing="2" fill="#71717a">// SOFTWARE ENGINEER</text>
  <text x="1116" y="38" text-anchor="end" font-family="Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#ff4a1c">[ .NET · GO · RUST · TS ]</text>

  <!-- Main Fierce Headline -->
  <text x="92" y="152" font-family="Arial,sans-serif" font-size="62" font-weight="900" letter-spacing="-2" fill="#f4f1ea">IDEAS BECOME</text>

  <rect x="92" y="176" width="12" height="58" fill="#ff4a1c"/>
  <text x="120" y="226" font-family="Arial,sans-serif" font-size="62" font-weight="900" letter-spacing="-2" fill="#ff4a1c">USEFUL SOFTWARE.</text>

  <text x="92" y="276" font-family="Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="0.3" fill="#a1a1aa">No fluff. Relentless execution from raw data models to production UI.</text>

  <!-- Right-side system spec module -->
  <rect x="822" y="96" width="286" height="188" rx="4" fill="#111116" stroke="#272730" stroke-width="1.2"/>
  <line x1="822" y1="132" x2="1108" y2="132" stroke="#272730" stroke-width="1"/>
  <rect x="838" y="110" width="8" height="8" fill="#ff4a1c"/>
  <text x="856" y="118" font-family="Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#f4f1ea"> ARCHITECTURE &amp; FOCUS</text>

  <text x="840" y="162" font-family="Consolas,monospace" font-size="12" fill="#ff4a1c">&gt;</text>
  <text x="858" y="162" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#e4e4e7">Clean Data Models</text>

  <text x="840" y="190" font-family="Consolas,monospace" font-size="12" fill="#ff4a1c">&gt;</text>
  <text x="858" y="190" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#e4e4e7">High-Throughput APIs</text>

  <text x="840" y="218" font-family="Consolas,monospace" font-size="12" fill="#ff4a1c">&gt;</text>
  <text x="858" y="218" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#e4e4e7">Native &amp; Web Interfaces</text>

  <line x1="838" y1="240" x2="1092" y2="240" stroke="#1f1f27" stroke-width="1"/>
  <text x="840" y="264" font-family="Consolas,monospace" font-size="11" letter-spacing="1.2" fill="#71717a">MODE: FULL-STACK OWNERSHIP</text>

  <!-- Bottom pipeline bar -->
  <text x="84" y="352" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#a1a1aa">01 // DATA MODEL</text>
  <text x="252" y="352" font-family="Consolas,monospace" font-size="12" fill="#ff4a1c">───▸</text>
  <text x="304" y="352" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#a1a1aa">02 // BACKEND API</text>
  <text x="480" y="352" font-family="Consolas,monospace" font-size="12" fill="#ff4a1c">───▸</text>
  <text x="532" y="352" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#f4f1ea">03 // DEPLOYED UI</text>
  <text x="1116" y="352" text-anchor="end" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#71717a">@PARINTF</text>
</svg>
